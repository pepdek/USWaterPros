<!doctype html><html><head><meta charset="utf-8"><title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,700,60,1;1,9..144,600,60,1&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;position:relative;background:#fbf8f1;font-family:'Libre Franklin',sans-serif;color:#101c2e}
  .bg{position:absolute;inset:0;background:radial-gradient(760px 480px at 0% -10%,#cfe4f4 0%,rgba(207,228,244,0) 65%),radial-gradient(620px 440px at 100% 0%,#f6d9d2 0%,rgba(246,217,210,0) 62%),linear-gradient(#f6f3ea,#fbf8f1)}
  .stripes{position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(90deg,#b3202a 0 33.333%,#fff 33.333% 66.666%,#0b2545 66.666% 100%) 0 0/144px 100%}
  .left{position:absolute;left:72px;top:70px;width:690px}
  .eyebrow{font-family:'Barlow Condensed';font-weight:700;font-size:27px;letter-spacing:.18em;text-transform:uppercase;color:#1b4f8f}
  .eyebrow b{color:#b3202a;font-size:20px;margin-right:12px}
  h1{margin-top:22px;font-family:'Fraunces';font-weight:700;font-variation-settings:'SOFT' 60,'WONK' 1;font-size:76px;line-height:1.0;letter-spacing:-.03em}
  h1 i{display:block;color:#b3202a;font-weight:600}
  p{margin-top:26px;font-size:28px;line-height:1.4;color:#46505e;max-width:560px}
  .tag{position:absolute;left:72px;bottom:62px;display:flex;align-items:center;gap:18px}
  .pill{font-family:'Barlow Condensed';font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase;background:#0b2545;color:#fff;padding:10px 26px 12px;border-radius:99px}
  .pill b{color:#ff8a96;margin-right:10px}
  .url{font-family:'Barlow Condensed';font-weight:700;font-size:30px;letter-spacing:.12em;color:#5b6472;text-transform:uppercase}
  .photo{position:absolute;right:74px;top:58px;width:400px;height:500px;border-radius:40px;overflow:hidden;border:7px solid #fff;box-shadow:0 40px 70px -30px rgba(11,37,69,.55);background:url(photo.jpg) center/cover}
  .seal{position:absolute;right:36px;bottom:40px;width:190px;height:190px;transform:rotate(-10deg);filter:drop-shadow(0 16px 20px rgba(11,37,69,.35))}
</style></head><body>
<div class="bg"></div>
<div class="left">
  <div class="eyebrow"><b>★</b>America’s Water Professionals</div>
  <h1>Chlorine taste gone.<i>Done in a day.</i></h1>
  <p>The price up front. Installed by licensed local plumbers.</p>
</div>
<div class="tag"><span class="pill"><b>★</b>Pierce County, WA</span><span class="url">uswaterpros.com</span></div>
<div class="photo"></div>
<svg class="seal" viewBox="0 0 200 200"><defs><path id="r" d="M100 100 m-70 0 a70 70 0 1 1 140 0 a70 70 0 1 1 -140 0"/></defs>
<circle cx="100" cy="100" r="96" fill="#0b2545"/><circle cx="100" cy="100" r="90" fill="none" stroke="#fbf8f1" stroke-opacity=".55" stroke-width="1.5"/><circle cx="100" cy="100" r="52" fill="none" stroke="#fbf8f1" stroke-opacity=".4"/>
<text fill="#fbf8f1" style="font-family:'Barlow Condensed';font-weight:700;font-size:16px"><textPath href="#r" textLength="432" lengthAdjust="spacing">★ LICENSED LOCAL PLUMBERS ★ TACOMA, WASHINGTON ★</textPath></text>
<polygon points="100,70 108.8,89.4 130,91.7 114.1,106 118.6,127 100,116.4 81.4,127 85.9,106 70,91.7 91.2,89.4" fill="#b3202a"/></svg>
<div class="stripes"></div>
</body></html>
